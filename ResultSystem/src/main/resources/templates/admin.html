<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">VIT Result Admin</span><a href="/" class="btn btn-light btn-sm">Student Portal</a></div></nav><main class="container py-4"><div class="alert alert-info">First click <b>Seed Subjects</b> once to create the four required subjects.</div><form action="/admin/seed" method="post" class="mb-4"><button class="btn btn-primary">Seed Subjects</button></form><div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-body"><h4>Add Student</h4><form action="/admin/student" method="post"><input name="prn" class="form-control mb-2" placeholder="PRN" required><input name="name" class="form-control mb-2" placeholder="Student Name" required><input name="branch" class="form-control mb-2" placeholder="Branch" required><input name="semester" class="form-control mb-3" placeholder="Semester" required><button class="btn btn-success w-100">Save Student</button></form></div></div></div><div class="col-lg-7"><div class="card"><div class="card-body"><h4>Add / Update Marks</h4><form action="/admin/marks" method="post"><select name="studentId" class="form-select mb-2" required><option value="">Select Student</option><option th:each="s:${students}" th:value="${s.id}" th:text="${s.prn+' - '+s.name}"></option></select><select name="subjectId" class="form-select mb-2" required><option value="">Select Subject</option><option th:each="s:${subjects}" th:value="${s.id}" th:text="${s.name}"></option></select><div class="row"><div class="col"><input type="number" step="0.01" min="0" max="30" name="mse" class="form-control mb-2" placeholder="MSE / 30" required></div><div class="col"><input type="number" step="0.01" min="0" max="70" name="ese" class="form-control mb-2" placeholder="ESE / 70" required></div></div><button class="btn btn-success w-100">Save Marks</button></form></div></div></div></div></main></body></html>
