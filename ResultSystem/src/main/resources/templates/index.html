<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIT Semester Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand fw-bold">VIT Semester Result Portal</span><a class="btn btn-light btn-sm" href="/admin">Admin</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-lg border-0"><div class="card-body p-5"><h1 class="fw-bold">Check Semester Result</h1><p class="text-muted">Enter your VIT student PRN to view MSE (30%) + ESE (70%) result.</p><form action="/result" method="get"><label class="form-label">PRN</label><input name="prn" class="form-control form-control-lg mb-3" placeholder="Enter PRN" required><button class="btn btn-primary btn-lg w-100">View Result</button></form><div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div></div></div></div></div></main></body></html>
