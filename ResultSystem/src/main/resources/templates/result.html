<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a href="/" class="navbar-brand fw-bold">VIT Result Portal</a></div></nav><main class="container py-4"><div class="card shadow-sm border-0 mb-4"><div class="card-body"><div class="row"><div class="col-md-6"><h2 th:text="${student.name}"></h2><p class="mb-1"><b>PRN:</b> <span th:text="${student.prn}"></span></p><p class="mb-1"><b>Branch:</b> <span th:text="${student.branch}"></span></p></div><div class="col-md-6 text-md-end"><p><b>Semester:</b> <span th:text="${student.semester}"></span></p></div></div></div></div><div class="card shadow-sm border-0"><div class="card-body"><h4 class="mb-3">Semester Marks</h4><div class="table-responsive"><table class="table table-bordered align-middle"><thead class="table-primary"><tr><th>Subject</th><th>MSE (30%)</th><th>ESE (70%)</th><th>Total / 100</th></tr></thead><tbody><tr th:each="m : ${marks}"><td th:text="${m.subject.name}"></td><td th:text="${m.mse}"></td><td th:text="${m.ese}"></td><td class="fw-bold" th:text="${m.total}"></td></tr></tbody></table></div><div class="row g-3 mt-2"><div class="col-md-6"><div class="summary"><small>Total Marks</small><div th:text="${total} + ' / ' + (${marks.size()} * 100)"></div></div></div><div class="col-md-6"><div class="summary"><small>Percentage</small><div th:text="${#numbers.formatDecimal(percentage,1,2)} + '%' "></div></div></div></div><button onclick="window.print()" class="btn btn-outline-primary mt-4">Print Result</button></div></div></main></body></html>
